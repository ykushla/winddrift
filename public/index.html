<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101d">
  <title>Wind Drift</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="profile-block">
        <div class="eyebrow brand-label"><span class="wind-icon" aria-hidden="true">≋</span><span>WIND DRIFT</span></div>
        <h1 id="profile-name">Профіль не завантажено</h1>
        <div id="profile-meta" class="profile-meta"></div>
      </div>

      <div class="top-controls">
        <button id="import-button" class="button secondary">Імпорт CSV</button>
      </div>
      <input id="csv-input" type="file" accept=".csv,text/csv" hidden>
    </header>

    <div id="import-message" class="message info">
      У таблиці Applied Ballistics мають бути вимкнені Spin Drift, Coriolis та інші горизонтальні поправки, не пов’язані з вітром.
    </div>

    <section class="panel target-panel">
      <label for="target-distance">ДИСТАНЦІЯ ЦІЛІ</label>
      <div class="target-input-wrap">
        <input id="target-distance" class="target-input" type="number" inputmode="numeric" min="1" step="1">
        <span>м</span>
      </div>
    </section>

    <section class="panel">
      <div id="wind-points" class="wind-points"></div>
      <button id="add-point" class="add-point" aria-label="Додати точку вітру">+</button>
    </section>

    <section class="result-card" aria-live="polite">
      <div class="result-label">ПОПРАВКА</div>
      <div class="result-main">
        <span id="result-side" class="result-side">—</span>
        <span id="result-number" class="result-number">—</span>
        <span class="result-unit">MIL</span>
      </div>
      <div id="effective-wind" class="effective-wind">Імпортуй профіль для розрахунку</div>
      <div id="result-details" class="result-details"></div>
    </section>
  </main>

  <div id="clock-dialog" class="clock-dialog" hidden>
    <div class="clock-backdrop" data-clock-close></div>
    <section class="clock-sheet" role="dialog" aria-modal="true" aria-labelledby="clock-title">
      <div class="clock-sheet-head">
        <div>
          <div class="eyebrow">НАПРЯМОК ВІТРУ</div>
          <div id="clock-title" class="clock-selected">3:00</div>
        </div>
        <button type="button" class="clock-close" data-clock-close aria-label="Закрити">×</button>
      </div>
      <div id="clock-face" class="clock-face" aria-label="Вибір напрямку вітру"></div>
      <div class="clock-help">Натисни або веди пальцем по циферблату · крок 0,5 год</div>
    </section>
  </div>

  <script type="module" src="../src/ui/app.js"></script>
</body>
</html>
